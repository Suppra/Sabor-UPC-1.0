<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SaborUPC · tokens de diseño</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #fafafa; }
    .muestras { display: flex; flex-wrap: wrap; gap: 12px; }
    .muestra { width: 150px; border: 1px solid #ddd; border-radius: var(--radio-tarjeta); overflow: hidden; background: #fff; font-size: 13px; }
    .muestra div { height: 60px; }
    .muestra code { display: block; padding: 8px; }
  </style>
</head>
<body>
  <h1>Tokens de diseño de SaborUPC</h1>
  <p>Los micro frontends cargan <code>http://localhost:8085/tokens.css</code>. Cambie un valor aquí y recargue la aplicación.</p>
  <div class="muestras" id="muestras"></div>
  <script>
    ['--color-primario', '--color-acento', '--color-acento-oscuro', '--color-peligro', '--color-borde', '--color-texto-suave']
      .forEach(function (token) {
        document.getElementById('muestras').insertAdjacentHTML('beforeend',
          '<div class="muestra"><div style="background: var(' + token + ')"></div><code>' + token + '<br>' +
          getComputedStyle(document.documentElement).getPropertyValue(token).trim() + '</code></div>');
      });
  </script>
</body>
</html>
